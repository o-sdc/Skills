<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Access Denied</title>
    <style>
        body {
            background-color: #f0f2f5;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            border-top: 5px solid #d9534f;
        }
        h1 {
            font-size: 72px;
            margin: 0;
            color: #d9534f;
        }
        h2 {
            font-size: 24px;
            margin: 10px 0;
            color: #2c3e50;
        }
        p {
            color: #6c757d;
            font-size: 16px;
            line-height: 1.6;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #adb5bd;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn-home:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="icon">🚫</div>
    <h1>403</h1>
    <h2>Access Denied</h2>
    <p>You do not have permission to view this directory or page. <br> 
       Unauthorized access attempts are logged.</p>
    
    <a href="https://orbital-skills.github.io/osi.com/" class="btn-home">Go Back to Home</a>

    <div class="footer-text">
        Server: GitHub/Orbital-Skills-Secure-Gateway <br>
        Client IP: User-Restricted
    </div>
</div>

</body>
</html>
